<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Lyrimuse</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="https://yudaotor.github.io/lyrimuse/assets/img/favicon.png">
<meta name="color-scheme" content="light dark">
<style>
:root { --bg: #fbfbfd; --card: #fff; --ink: #1d1d1f; --ink-2: #6e6e73; --line: rgba(0, 0, 0, .1); --brand-ink: #c9365c; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --ink-2: #a1a1a6; --line: rgba(255, 255, 255, .14); --brand-ink: #ff5c86; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; background: var(--bg); color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "PingFang TC", "Helvetica Neue", sans-serif; text-align: center; }
main { width: min(560px, 100%); }
.icon { width: 72px; height: 72px; }
.code { margin: 14px 0 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--brand-ink); }
.nf:not([hidden]) ~ .nf:not([hidden]) { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--line); }
h1 { margin: 6px 0 8px; font-size: 28px; line-height: 1.25; letter-spacing: -.02em; }
p { margin: 0; color: var(--ink-2); }
.nf-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
.nf-links a { padding: 9px 18px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink);
  text-decoration: none; font-size: 15px; font-weight: 500; }
.nf-links a.primary { background: var(--ink); color: var(--bg); box-shadow: none; }
.nf-links a:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="https://yudaotor.github.io/lyrimuse/assets/img/app-icon.webp" alt="" width="72" height="72">
  <p class="code">404</p>
  <section class="nf" lang="en" data-title="Page not found · Lyrimuse">
    <h1>This page doesn&#x27;t exist</h1>
    <p>The link may be mistyped, or the page has moved.</p>
    <p class="nf-links"><a class="primary" href="https://yudaotor.github.io/lyrimuse/">Back to home</a><a href="https://yudaotor.github.io/lyrimuse/changelog/">Changelog</a><a href="https://github.com/Yudaotor/lyrimuse">GitHub</a></p>
  </section>
  <section class="nf" lang="zh-Hans" data-title="找不到页面 · Lyrimuse">
    <h1>这个页面不存在</h1>
    <p>可能是链接写错了，或者页面已经移走。</p>
    <p class="nf-links"><a class="primary" href="https://yudaotor.github.io/lyrimuse/zh/">回到首页</a><a href="https://yudaotor.github.io/lyrimuse/zh/changelog/">更新日志</a><a href="https://github.com/Yudaotor/lyrimuse">GitHub</a></p>
  </section>
  <section class="nf" lang="zh-Hant" data-title="找不到頁面 · Lyrimuse">
    <h1>這個頁面不存在</h1>
    <p>可能是連結寫錯了，或者頁面已經移走。</p>
    <p class="nf-links"><a class="primary" href="https://yudaotor.github.io/lyrimuse/zh-Hant/">回到首頁</a><a href="https://yudaotor.github.io/lyrimuse/zh-Hant/changelog/">更新記錄</a><a href="https://github.com/Yudaotor/lyrimuse">GitHub</a></p>
  </section>
</main>
<script>(function(){var l='en',p=location.pathname;
if(/\/zh-Hant\//.test(p))l='zh-Hant';else if(/\/zh\//.test(p))l='zh-Hans';else{
var s=null;try{s=localStorage.getItem('lyrimuse.lang')}catch(e){}
if(s==='en'||s==='zh-Hans'||s==='zh-Hant')l=s;else{
var list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||''];
for(var i=0;i<list.length;i++){var x=String(list[i]).toLowerCase();
if(x==='en'||x.indexOf('en-')===0)break;
if(x==='zh'||x.indexOf('zh-')===0){l=/-hant\b|-(tw|hk|mo)\b/.test(x)&&!/-hans\b/.test(x)?'zh-Hant':'zh-Hans';break}}}}
var blocks=document.querySelectorAll('.nf');for(var k=0;k<blocks.length;k++){
if(blocks[k].getAttribute('lang')===l){document.title=blocks[k].getAttribute('data-title');document.documentElement.lang=l}
else blocks[k].hidden=true}})()</script>
</body>
</html>
