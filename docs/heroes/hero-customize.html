<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hero-base.css">
<style>
  .canvas { flex-direction: column; justify-content: center; }
  .row { display: flex; gap: 32px; }
  .row1 .col { flex: 1; }
  .row2 { margin-top: 26px; justify-content: center; align-items: center; }
  .row2 .col.a { flex: 0 0 42%; }
  .row2 .col.b { flex: 0 0 24%; }
</style>
</head>
<body>
<div class="canvas">
  <div class="row row1">
    <div class="col">
      <div class="card"><img src="../images/app-settings.png"></div>
      <div class="cap">Every surface is an editor with a live, full-size preview</div>
    </div>
    <div class="col">
      <div class="card"><img src="../images/app-settings-notch.png"></div>
      <div class="cap">Dynamic-Island editor · themes, artwork, blur</div>
    </div>
  </div>
  <div class="row row2">
    <div class="col a">
      <div class="card"><img src="../images/app-player-settings.png"></div>
      <div class="cap">Pick several players at once — web players included</div>
    </div>
    <div class="col b">
      <div class="card"><img src="../images/app-menu-bar-dropdown.png"></div>
      <div class="cap">Everything, one dropdown away</div>
    </div>
  </div>
</div>
</body>
</html>
