<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hero-base.css">
<style>
  .canvas { align-items: center; }
  .left { flex: 0 0 51%; gap: 26px; justify-content: center; }
  .right { flex: 1; gap: 26px; justify-content: center; }
</style>
</head>
<body>
<div class="canvas">
  <div class="col left">
    <div class="col">
      <div class="card"><img src="../images/app-lastfm-profile.png"></div>
      <div class="cap">Last.fm profile · totals &amp; live recent scrobbles</div>
    </div>
    <div class="col">
      <div class="card"><img src="../images/app-idle-standby.png"></div>
      <div class="cap">Listening overview when nothing's playing</div>
    </div>
  </div>
  <div class="col right">
    <div class="col">
      <div class="card"><img src="../images/app-lastfm-charts.png"></div>
      <div class="cap">Top Artists / Albums / Tracks, by period</div>
    </div>
    <div class="col">
      <div class="card"><img src="../images/app-lastfm-heatmap.png"></div>
      <div class="cap">Listening heatmap · your whole year, GitHub-style</div>
    </div>
  </div>
</div>
</body>
</html>
