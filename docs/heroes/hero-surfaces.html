<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hero-base.css">
<style>
  .canvas { align-items: center; }
  .left { flex: 0 0 55%; }
  .right { flex: 1; gap: 24px; justify-content: center; }
</style>
</head>
<body>
<div class="canvas">
  <div class="col left">
    <div class="card"><img src="../images/app-lyrics-window.png"></div>
    <div class="cap">Lyrics Window · Apple-Music-style, word-by-word</div>
  </div>
  <div class="col right">
    <div class="col">
      <div class="card"><img src="../images/app-dynamic-island.png"></div>
      <div class="cap">Dynamic Island · hover expands, pause collapses</div>
    </div>
    <div class="col">
      <div class="card" style="background: rgba(255,255,255,.92); padding: 10px 14px;"><img src="assets/fresh-overlay-word-highlight.png"></div>
      <div class="cap">Floating overlay · word-by-word highlight</div>
    </div>
    <div class="col">
      <div class="card"><img src="../images/app-menu-bar-lyrics.png"></div>
      <div class="cap">Menu-bar lyrics</div>
    </div>
  </div>
</div>

</html>
