name: "Feature request · 功能建议"
description: "Something you'd like added or changed · 想要的新功能、想改的地方"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search first. A 👍 on an existing request helps more than a duplicate.
        提交前请先搜索。已有相同的建议时，在那一条点 👍 比重复提交更有用。
  - type: textarea
    id: what
    attributes:
      label: "What you want · 想要什么"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why · 什么场景下会用到"
      placeholder: "What made you want this / 遇到了什么情况才想要这个"
