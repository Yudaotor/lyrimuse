name: Release

# Real tag push (v*) -> validate the tag, run the full CI checks, build, sign, package, then
# publish a GitHub Release (draft first, asset check, then public).
# Manual dispatch (Actions tab, no tag needed) -> the same checks and build, uploaded as a
# workflow artifact only. Every publishing step is gated on the ref being a tag, not on which
# event triggered the run, so workflow_dispatch is a safe dry run against any branch.
# Why each gate exists: docs/releasing.md, "流水线的硬约束".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Same toolchain lyrimuse/build.sh and lyrimuse-collector/build.sh pin with GOTOOLCHAIN;
  # older Go emits binaries AMFI rejects on this project's machines.
  GO_VERSION: "1.24.4"

jobs:
  tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.tag.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow checkout peels annotated tags to the commit; the tag's own annotation is
          # the release notes, so full history is required.
          fetch-depth: 0

      # Annotated, non-empty, splits into en + zh-Hans, identical to its CHANGELOG.md section.
      # The rules live only in check_release_tag.sh (the tagger runs the same script locally).
      # The body is read once here and handed to the appcast and the Release page.
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! bash .github/scripts/check_release_tag.sh "$TAG" --body-out "$RUNNER_TEMP/tag-body.md"; then
            echo "::error::tag '${TAG}' failed release-tag validation (annotated / non-empty / bilingual notes / CHANGELOG.md) -- nothing was built, see the log above" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            cat "$RUNNER_TEMP/tag-body.md"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # The whole CI workflow (gofmt, vet, dead code, go test, strings parity, third-party licenses,
  # Swift selftest) runs against the tagged commit, so a release never depends on someone having
  # checked that dev's CI was green.
  checks:
    name: CI checks
    needs: tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build, sign, package, publish
    needs: [tag, checks]
    # Pinned image, bumped deliberately: the app needs the macOS 26 SDK to compile (Liquid Glass
    # symbols, all behind #available at runtime), and the label resolves to Apple Silicon, which
    # the arm64 primary requires -- package.sh hard-fails if the host is not arm64.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.sum is not at the repo root.
          cache-dependency-path: lyrimuse-collector/go.sum

      - name: Verify toolchains
        run: |
          swift --version
          go version

      # media-control (BSD-3-Clause) is copied into the .app by build.sh; without it the release
      # loses QQ Music support. The version must equal build.sh's MC_PIN_VER: the -intel variant's
      # x86_64 half only exists for 0.7.6 (later bottles are arm64-only), and build.sh refuses to
      # lipo mismatched halves. Fetched from ghcr by content hash, not via brew, so the runner's
      # brew index moving on never changes what ships. Bump MC_ARM_SHA here together with
      # build.sh's MC_PIN_VER / MC_SHA.
      - name: Install media-control (QQ 音乐支持)
        run: |
          MC_PIN_VER=0.7.6
          MC_ARM_SHA=179a21d0233706e75adcb70048386b3e471ad364e192e8ba0da80121a09d4ce4
          dst="$RUNNER_TEMP/media-control"
          mkdir -p "$dst"
          curl -fsSL -H "Authorization: Bearer QQ==" \
            "https://ghcr.io/v2/homebrew/core/media-control/blobs/sha256:$MC_ARM_SHA" \
            -o "$dst/bottle.tar.gz"
          got="$(shasum -a 256 "$dst/bottle.tar.gz" | awk '{print $1}')"
          if [ "$got" != "$MC_ARM_SHA" ]; then
            echo "::error::media-control arm64 bottle 校验不过:拿到 $got,期望 $MC_ARM_SHA" >&2
            exit 1
          fi
          tar -xzf "$dst/bottle.tar.gz" -C "$dst"
          prefix="$dst/media-control/$MC_PIN_VER"
          if [ ! -x "$prefix/bin/media-control" ]; then
            echo "::error::解出来的 bottle 里没有 $prefix/bin/media-control(bottle 结构变了?)" >&2
            exit 1
          fi
          echo "LYRIMUSE_MEDIA_CONTROL_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "==> media-control $MC_PIN_VER (arm64, ghcr blob) -> $prefix"

      - name: Determine version string
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            # Display version = tag minus "v". build-version.sh is the single definition of a
            # valid version and of the numeric CFBundleVersion Sparkle compares (its comparator
            # ignores everything after "-").
            BUNDLE_VERSION="${VERSION#v}"
            if ! BUILD_VERSION="$(bash lyrimuse/scripts/build-version.sh "$BUNDLE_VERSION")"; then
              echo "::error::tag '${VERSION}' is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N -- refusing to build" >&2
              exit 1
            fi
            # A "-" marks a pre-release: GitHub's releases/latest (and so every regular user's
            # appcast) skips it; only users who opted into beta updates see it.
            if [[ "$VERSION" == *-* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi
          else
            # Dry run: placeholder versions, never published.
            VERSION="dev-$(git rev-parse --short HEAD)"
            BUNDLE_VERSION="1.0.0"
            BUILD_VERSION="1.0.0.1000"
            IS_PRERELEASE=false
          fi
          # package.sh names its output from the built app's Info.plist, so asset_base follows the
          # bundle version, not the tag.
          {
            echo "version=${VERSION}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "asset_base=Lyrimuse-v${BUNDLE_VERSION}-macos"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} (display ${BUNDLE_VERSION}, CFBundleVersion ${BUILD_VERSION}, prerelease=${IS_PRERELEASE})"

      # dmgbuild writes the DMG's .DS_Store itself (background image, icon positions) instead of
      # driving Finder. It runs while the signing keychain is unlocked, so only the exact bytes in
      # dmgbuild-requirements.txt may be installed. If this fails package.sh falls back to plain
      # hdiutil: the DMG loses its looks, the release does not fail.
      - name: Install dmgbuild
        run: python3 -m pip install --user --break-system-packages --require-hashes -r .github/scripts/dmgbuild-requirements.txt
        continue-on-error: true

      # Fixed self-signed certificate instead of ad-hoc: TCC stores grants against the designated
      # requirement, and an ad-hoc requirement (the build's cdhash) changes on every update, which
      # silently voids Accessibility / Automation / Full Disk Access. Gatekeeper is unaffected
      # (not notarized). The p12 must be exported with `openssl pkcs12 -export -legacy` or
      # `security import` reports a MAC failure. -x imports the key as non-extractable;
      # set-key-partition-list lets codesign use it without a UI prompt (without it the job hangs).
      # A tag build without the secret fails here; a dry run falls back to ad-hoc with a warning.
      - name: Import release signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::MACOS_SIGN_P12 is not set; refusing to publish an ad-hoc signed release"
              exit 1
            fi
            echo "::warning::MACOS_SIGN_P12 is not set; this dry run is ad-hoc signed"
            exit 0
          fi
          KC="$RUNNER_TEMP/release-signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/release-signing.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -x
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" > /dev/null
          # build.sh calls plain `codesign -s`, which only searches the user search list. The
          # existing list is intentionally word-split into separate arguments.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SHA="$(security find-identity -p codesigning "$KC" | awk '/"Lyrimuse Release Signing"/{print $2; exit}')"
          if [ -z "$SHA" ]; then
            echo "::error::no \"Lyrimuse Release Signing\" identity in the imported p12"
            exit 1
          fi
          echo "LYRIMUSE_SIGN_ID=$SHA" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "Signing identity: $SHA"

      # package.sh is the single definition of a release asset: it builds the arm64-only primary
      # and the universal -intel variant, and refuses to package unless every Mach-O has exactly the
      # expected architectures, the SDK field is >= 26, `codesign -v --deep --strict` passes and
      # (on tag builds) the signature requirement is certificate-based.
      - name: Build + package release assets
        env:
          LYRIMUSE_REQUIRE_STABLE_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          LYRIMUSE_VERSION="${{ steps.version.outputs.bundle_version }}" ./lyrimuse/package.sh
          ls -la lyrimuse/dist

      - name: Remove release signing keychain
        if: always()
        run: |
          if [ -n "${RELEASE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$RELEASE_SIGNING_KEYCHAIN" || true
          fi

      # Every run, including a bare dry run: download the assets from the run page to smoke-test.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.version.outputs.asset_base }}
          path: lyrimuse/dist/*
          retention-days: 14

      # Tag builds only (needs SPARKLE_PRIVATE_KEY; enclosure URLs only exist once published).
      #
      # Feed shape (check_appcast.py asserts all of it; the reasons are in docs/releasing.md):
      #   - enclosures point at releases/download/<tag>/, never releases/latest/ (a pre-release is
      #     never latest, so a latest/ link would 404);
      #   - two items with the same version: #1 the arm64-only zip WITH the
      #     <sparkle:hardwareRequirements>arm64</...> child element, #2 the -intel zip without it.
      #     Sparkle drops items whose hardware requirement fails, then takes the FIRST of equal
      #     versions, so arm64 must come first; spelled as an <enclosure> attribute it matches
      #     nothing and hands the arm64 zip to Intel clients;
      #   - sparkle:version is the numeric CFBundleVersion read back from the zip;
      #   - pre-release items carry <sparkle:channel>beta</sparkle:channel>;
      #   - release notes are split into <description xml:lang="en|zh-Hans"> by
      #     split_release_notes.py (check_release_tag.sh already ran it, so the single-description
      #     fallback is only a safety valve).
      # The private key never touches disk: `sign_update --ed-key-file -` reads it from stdin.
      # Both signatures are verified against the SUPublicEDKey embedded in each zip before the
      # feed is written, so a key that does not pair with build.sh's public key fails here instead
      # of breaking every user's update.
      - name: Generate signed appcast
        if: startsWith(github.ref, 'refs/tags/')
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # Passed through env, never interpolated into the script text: the tag body is free-form
          # and this step also holds SPARKLE_PRIVATE_KEY.
          NOTES_RAW: ${{ needs.tag.outputs.body }}
        run: |
          # build.sh builds from lyrimuse/, so SwiftPM artifacts live under lyrimuse/.build/.
          SIGN_UPDATE=$(find lyrimuse/.build/artifacts/sparkle -type f -name sign_update | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            echo "sign_update not found under lyrimuse/.build/artifacts/sparkle -- did the build step resolve the Sparkle SPM dependency?" >&2
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"
          VERSION="${{ steps.version.outputs.bundle_version }}"
          ZIP_NAME="${{ steps.version.outputs.asset_base }}.zip"
          INTEL_ZIP_NAME="${{ steps.version.outputs.asset_base }}-intel.zip"
          # A missing zip would otherwise become length="" -- a feed Sparkle silently refuses.
          for z in "$ZIP_NAME" "$INTEL_ZIP_NAME"; do
            if [ ! -f "lyrimuse/dist/$z" ]; then
              echo "expected release zip missing: lyrimuse/dist/$z" >&2
              exit 1
            fi
          done
          TAG="${{ steps.version.outputs.version }}"
          BUILD_VERSION="$(unzip -p "lyrimuse/dist/${ZIP_NAME}" 'Lyrimuse.app/Contents/Info.plist' | plutil -extract CFBundleVersion raw -o - -)"
          if [ "$BUILD_VERSION" != "${{ steps.version.outputs.build_version }}" ]; then
            echo "CFBundleVersion inside the zip ($BUILD_VERSION) != build-version.sh (${{ steps.version.outputs.build_version }})" >&2
            exit 1
          fi
          LENGTH=$(stat -f%z "lyrimuse/dist/${ZIP_NAME}")
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "lyrimuse/dist/${ZIP_NAME}")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          INTEL_LENGTH=$(stat -f%z "lyrimuse/dist/${INTEL_ZIP_NAME}")
          INTEL_SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "lyrimuse/dist/${INTEL_ZIP_NAME}")
          INTEL_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${INTEL_ZIP_NAME}"
          swift .github/scripts/verify_sparkle_signature.swift \
            "lyrimuse/dist/${ZIP_NAME}" "$SIGNATURE" \
            "lyrimuse/dist/${INTEL_ZIP_NAME}" "$INTEL_SIGNATURE"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # Only "]]>" needs handling inside CDATA (split it into two CDATA sections). No embedded
          # heredoc or python here: a flush-left body breaks this YAML block scalar.
          escape_cdata() {
            local s="$1"
            s="${s//]]>/]]]]><![CDATA[>}"
            if [ -z "${s//[[:space:]]/}" ]; then
              s="See the GitHub release page for details."
            fi
            printf '%s' "$s"
          }
          SPLIT_DIR="$RUNNER_TEMP/notes-split"
          printf '%s\n' "$NOTES_RAW" > "$RUNNER_TEMP/notes-raw.md"
          if python3 .github/scripts/split_release_notes.py "$RUNNER_TEMP/notes-raw.md" "$SPLIT_DIR"; then
            EN_HTML=$(escape_cdata "$(cat "$SPLIT_DIR/notes.en.html")")
            ZH_HTML=$(escape_cdata "$(cat "$SPLIT_DIR/notes.zh-Hans.html")")
            DESCRIPTION_XML=$(
              echo '      <description xml:lang="en"><![CDATA['
              printf '%s\n' "$EN_HTML"
              echo '      ]]></description>'
              echo '      <description xml:lang="zh-Hans"><![CDATA['
              printf '%s\n' "$ZH_HTML"
              echo '      ]]></description>'
            )
          else
            NOTES_HTML=$(escape_cdata "$NOTES_RAW")
            DESCRIPTION_XML=$(
              echo '      <description><![CDATA[<pre>'
              printf '%s\n' "$NOTES_HTML"
              echo '      </pre>]]></description>'
            )
          fi
          # Built line by line with echo rather than a heredoc, for the same YAML reason.
          # $4 = "yes" adds hardwareRequirements (arm64-only item).
          emit_item() {
            local url="$1" sig="$2" len="$3" arm64_only="$4"
            echo '    <item>'
            echo "      <title>${{ steps.version.outputs.version }}</title>"
            echo "      <pubDate>${PUB_DATE}</pubDate>"
            echo "      <sparkle:version>${BUILD_VERSION}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            printf '%s\n' "$DESCRIPTION_XML"
            echo '      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
              echo '      <sparkle:channel>beta</sparkle:channel>'
            fi
            if [ "$arm64_only" = "yes" ]; then
              echo '      <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>'
            fi
            echo "      <enclosure url=\"${url}\" sparkle:version=\"${BUILD_VERSION}\" sparkle:edSignature=\"${sig}\" length=\"${len}\" type=\"application/octet-stream\" />"
            echo '    </item>'
          }
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>Lyrimuse Updates</title>'
            echo "    <link>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</link>"
            echo '    <description>Lyrimuse release feed</description>'
            echo '    <language>en</language>'
            # arm64 item first -- see the feed-shape note above.
            emit_item "$DOWNLOAD_URL" "$SIGNATURE" "$LENGTH" yes
            emit_item "$INTEL_DOWNLOAD_URL" "$INTEL_SIGNATURE" "$INTEL_LENGTH" no
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml
          echo "---- appcast.xml ----"
          cat appcast.xml
          python3 .github/scripts/check_appcast.py appcast.xml --tag "$TAG" --display-version "$VERSION" --build-version "$BUILD_VERSION" --prerelease "${{ steps.version.outputs.is_prerelease }}"

      # Created as a draft: nothing is visible to users (and releases/latest does not move) until
      # the asset check below passes. An explicit body is required -- without it
      # generate_release_notes replaces the body with GitHub's compare link instead of appending.
      - name: Create GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Category words in the title: release titles are what search surfaces first.
          name: Lyrimuse ${{ steps.version.outputs.version }} — macOS Desktop Lyrics for Apple Music & Spotify
          body: ${{ needs.tag.outputs.body }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          # The unsuffixed zip is arm64-only (what Sparkle and the Homebrew cask use); -intel is
          # universal. Each ships as a zip (Sparkle / cask) plus a dmg for manual downloads.
          files: |
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}.zip
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}.zip.sha256
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}.dmg
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}-intel.zip
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}-intel.zip.sha256
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}-intel.dmg
            appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every file must be attached to the draft with exactly the local byte size before anything
      # goes public. A failure leaves an unpublished draft behind; rerunning the job updates it.
      - name: Verify draft assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          BASE="${{ steps.version.outputs.asset_base }}"
          gh release view "$TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != "true" ]; then
            echo "::error::release $TAG is not a draft -- refusing to continue" >&2
            exit 1
          fi
          for f in "lyrimuse/dist/$BASE.zip" "lyrimuse/dist/$BASE.zip.sha256" "lyrimuse/dist/$BASE.dmg" \
                   "lyrimuse/dist/$BASE-intel.zip" "lyrimuse/dist/$BASE-intel.zip.sha256" "lyrimuse/dist/$BASE-intel.dmg" \
                   appcast.xml; do
            name="$(basename "$f")"
            want="$(stat -f%z "$f")"
            got="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' "$RUNNER_TEMP/release.json")"
            if [ "$got" != "$want" ]; then
              echo "::error::draft asset $name has size '${got:-missing}', expected $want" >&2
              exit 1
            fi
            echo "ok  $name ($want bytes)"
          done

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.version }}" --draft=false

      # The appcast's enclosure URLs only resolve once the release is public. Probe them for real;
      # assets can take a few seconds to appear, so retry.
      - name: Verify published download URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          for name in "${{ steps.version.outputs.asset_base }}.zip" "${{ steps.version.outputs.asset_base }}-intel.zip" appcast.xml; do
            ok=""
            for _ in 1 2 3 4 5 6; do
              if curl -sSfIL --max-time 30 "${BASE}/${name}" -o /dev/null; then ok=1; break; fi
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "::error::${BASE}/${name} is not downloadable" >&2
              exit 1
            fi
            echo "ok  ${BASE}/${name}"
          done
