name: Release

# Real tag push (v*) -> build, ad-hoc sign, package, publish a public GitHub Release.
# Manual dispatch (Actions tab, no tag needed) -> build, sign, package, upload as a
# workflow artifact only. The "Create GitHub Release" step is gated on the ref being a
# tag, not on which event triggered the run -- that's what makes workflow_dispatch a safe
# dry run: fire it against any branch, any time, and it will never create or touch a
# public Release. Only an actual tag push reaches that step.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Matches GOTOOLCHAIN=go1.24.4 hardcoded in both lyrimuse/build.sh and
  # lyrimuse-collector/build.sh -- system Go on some machines is older; go1.24.4 is the
  # first toolchain confirmed to emit a native LC_UUID + valid signature that AMFI accepts.
  GO_VERSION: "1.24.4"

jobs:
  build:
    name: Build, ad-hoc sign, package
    # Pinned to a specific image, not "macos-latest" -- macos-latest can silently jump to
    # a newer Xcode/OS on GitHub's own schedule; bump this deliberately instead.
    #
    # Bumped 15 -> 26 because the settings rework uses the Liquid Glass API
    # (SettingsDesignSystem.swift: .buttonStyle(.glass)/.glassProminent,
    # GlassEffectContainer). Every use is behind `if #available(macOS 26.0, *)`, but that
    # only gates them at runtime -- the symbols still have to exist in the SDK to compile,
    # and macos-15 ships the macOS 15 SDK, so the whole app failed to build there with
    # "cannot find 'GlassEffectContainer' in scope". Deployment target is unchanged
    # (Package.swift pins .macOS(.v14)); a newer SDK does not raise it.
    #
    # The label resolves to an Apple Silicon runner, which the primary variant requires.
    # If that ever changes, it fails loudly rather than silently: package.sh builds the
    # primary for the host architecture and hard-fails when it is not exactly arm64.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 -- a shallow (default depth-1) checkout does NOT reliably bring
          # along annotated tag objects/messages, only the commit the pushed ref points to.
          # The "Extract tag changelog" step below reads the pushed tag's own annotation
          # message, which silently came back empty on v1.0.0/v1.0.1 for exactly this
          # reason (verified after the fact via `gh release view` -- both releases' pages
          # only ever showed GitHub's auto-generated compare link, never the changelog that
          # was actually written into each tag's message). Full history costs a bit more
          # fetch time on CI but this repo is small; correctness here matters more.
          fetch-depth: 0
        # lyrimuse/ and lyrimuse-collector/ are sibling directories in this one repo (not
        # two repos) -- lyrimuse/build.sh does `(cd ../lyrimuse-collector && ...)`, so a
        # single full checkout already lays both out side by side. No submodules needed.

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: lyrimuse-collector/go.sum
          # go.sum lives in lyrimuse-collector/, not the repo root -- without this,
          # setup-go's module cache silently never finds anything to key off of (seen as
          # a "Restore cache failed: ... Supported file pattern: go.mod" annotation on the
          # first real run of this workflow) and just re-downloads deps every time.
        # Installing the exact toolchain here means go1.24.4 is already on PATH and
        # cached before build.sh ever calls `go build`. When the active `go` binary
        # already reports 1.24.4, GOTOOLCHAIN=go1.24.4 (set inside build.sh itself) is
        # just a no-op version match -- no network fetch happens mid-build. Swift's
        # Command Line Tools ship preinstalled on GitHub's macOS runner images, so no
        # separate Swift setup step is needed.

      - name: Verify toolchains
        run: |
          swift --version
          go version

      # 2026-08-03 补上——这之前整条流水线从来没有跑过任何测试:编译能过就直接签名
      # 打包发布,selftest/go test 挂没挂全靠开发者自己在本地手动跑,是"人肉网关"不是
      # 机制保证,漏跑一次坏版本就会真的发出去。放在装 media-control/构建之前,遵循
      # "先跑最快、最容易暴露问题的检查"的 fail-fast 原则——测试挂了就不用再浪费时间
      # 走完整个签名打包流程。GOTOOLCHAIN 这里其实是空操作(setup-go 已经装的就是
      # env.GO_VERSION 这个精确版本,不需要再下载切换),写出来只是跟 build.sh 自己的
      # 约定保持一致、意图更明确。
      - name: Run test suites
        run: |
          echo "==> Go tests (lyrimuse-collector)"
          (cd lyrimuse-collector && GOTOOLCHAIN="go${{ env.GO_VERSION }}" go test ./...)
          echo "==> Swift selftest (lyrimuse)"
          # `swift build` then execute the binary, NOT `swift run`. On the macos-15 runner
          # (SwiftPM 6.1.2) `swift run lyrimuse-selftest` is SIGKILLed the instant it execs
          # what it just built: the build reports success, then the shell prints
          # "Killed: 9" and the step exits 137. The binary is not the problem -- verified on
          # the runner that it is a valid ad-hoc-signed arm64 Mach-O, that `codesign -v`
          # passes and its designated requirement is satisfied, that no crash report is
          # written, and that running it directly prints ALL PASS and exits 0 (so do
          # re-signing it and running a copy). Only SwiftPM's own exec wrapper dies, so
          # don't use it. A newer local toolchain runs `swift run` fine, which is why this
          # only surfaced the first time this step actually ran on CI.
          (cd lyrimuse && swift build --product lyrimuse-selftest && ./.build/debug/lyrimuse-selftest)

      - name: Install media-control (QQ 音乐支持)
        # ungive/media-control(BSD-3-Clause),build.sh 会把它拷进 .app 包——不装的话
        # build.sh 只是打个警告跳过这一步,不会让整个构建失败,但发布出去的这份 zip 就
        # 不支持切到 QQ 音乐。GitHub 的 macOS runner 镜像自带 Homebrew。
        run: brew install media-control

      - name: Determine version string
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            # BUNDLE_VERSION feeds build.sh's CFBundleShortVersionString/CFBundleVersion,
            # which the in-app update checker compares against this repo's Releases --
            # strip the leading "v" so it's a clean X.Y.Z, matching what UpdateChecker.swift
            # does to the tag_name it gets back from the GitHub API.
            BUNDLE_VERSION="${VERSION#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            # Not a real release tag, so there's no meaningful X.Y.Z here -- build.sh's own
            # placeholder default is fine, this build will never reach the public Releases
            # page anyway (see the "Create GitHub Release" step's tag-only gate below).
            BUNDLE_VERSION="1.0.0"
          fi
          # asset_base is derived from the bundle version, not the tag: package.sh names its
          # output from the built app's own Info.plist, so the two have to agree. On a tag
          # push they do by construction (v1.3.0 -> 1.3.0 -> Lyrimuse-v1.3.0-macos...); on a
          # dry run the placeholder bundle version is what actually lands on disk.
          {
            echo "version=${VERSION}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "asset_base=Lyrimuse-v${BUNDLE_VERSION}-macos"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} (bundle version ${BUNDLE_VERSION})"

      # package.sh, not build.sh -- it is the single definition of what a release asset is,
      # and it builds BOTH variants: an arm64-only primary and a universal one for Intel.
      # Until 2026-08-07 this job ran build.sh once and shipped whatever architecture the
      # runner happened to be, which is how v1.0.0 through v1.2.0 all went out arm64-only
      # without anyone noticing.
      #
      # No separate signature sanity-check step follows this one any more: package.sh
      # already refuses to package unless every Mach-O in each variant matches the expected
      # architecture set exactly (missing *or* extra) and `codesign -v --deep --strict`
      # passes. Those are hard failures inside the script, so a green step here means more
      # than the old codesign echo did.
      # dmgbuild produces the DMG with a background image and fixed icon positions. It
      # writes the .DS_Store itself instead of driving Finder over AppleScript, so there is
      # no GUI automation on the runner. package.sh falls back to plain hdiutil when the
      # module is missing, so a failure here degrades the DMG's looks, never the release.
      - name: Install dmgbuild
        run: python3 -m pip install --user --break-system-packages dmgbuild
        continue-on-error: true

      - name: Build + package release assets
        run: |
          LYRIMUSE_VERSION="${{ steps.version.outputs.bundle_version }}" ./lyrimuse/package.sh
          ls -la lyrimuse/dist

      - name: Upload workflow artifact (every run -- tag push or manual dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset_base }}
          path: lyrimuse/dist/*
          retention-days: 14
        # Always runs, including on a bare workflow_dispatch with no tag -- the manual
        # dry-run path: download the assets straight from the Actions run page and
        # smoke-test them, without ever touching the public Releases tab.

      # Only runs on a real tag push, same gate as "Create GitHub Release" below --
      # appcast.xml's enclosure URL points at releases/latest/download/..., which is
      # meaningless without an actual Release, and this step needs the SPARKLE_PRIVATE_KEY
      # secret that a bare workflow_dispatch dry run has no reason to touch.
      #
      # sign_update lives in the same SPM binary-target download that build.sh's Sparkle
      # embedding step already pulled in (.build/artifacts/sparkle/Sparkle/bin/) -- no
      # separate download needed here.
      #
      # The private key never touches disk here: `--ed-key-file -` reads it from stdin,
      # piped straight from the GitHub Secret. This is Sparkle's own documented CI pattern
      # (see sign_update --help), not something improvised for this project.
      #
      # appcast.xml only ever lists this one release, not full history -- SPUStandardUpdaterController
      # only needs the latest item to decide "is there something newer than what's
      # installed," and not maintaining a multi-version feed avoids having to keep every
      # past release's zip around on the runner just to regenerate a fuller feed.
      #
      # The feed carries TWO items for the same version, and that is how Intel Macs get
      # auto-updates (2026-09-01; before this the feed listed the arm64 zip only and Intel
      # users had to download the -intel asset from the Releases page by hand -- the
      # -intel.zip download counter sat at exactly 0 for the whole v1.4.0 cycle, which is
      # what that arrangement looks like from the outside):
      #
      #   item #1  the arm64-only zip, WITH <sparkle:hardwareRequirements>arm64</...>
      #   item #2  the -intel (universal) zip, with NO hardwareRequirements element
      #
      # Sparkle filters before it picks: SUAppcastDriver.filterSupportedAppcast: drops every
      # item whose arm64HardwareRequirementIsOK is false, and only then does
      # bestItemFromAppcastItems: choose among what survives. So a native x86_64 client never
      # even sees item #1 and lands on #2; an arm64 client sees both and takes #1. This is
      # Sparkle's own documented-by-unit-test behaviour -- Tests/SUAppcastTest.swift
      # testARM64Requirement asserts exactly this shape (6 items -> 2 survive on x86_64,
      # 5 on arm64, with the expected winner each way).
      #
      # ⚠️ ORDER MATTERS AND FAILS SILENTLY. Both items carry the same sparkle:version, and
      # bestItemFromAppcastItems: only advances on a strictly-newer comparison ("if two items
      # are equal, we must select the first matching one"). So whichever item is emitted
      # FIRST is what arm64 clients get. Emit the arm64 one first: flip the order and every
      # Apple Silicon user silently starts pulling the ~2x larger universal zip (21 MB vs
      # 11 MB) -- it still installs and runs, so nothing ever surfaces the mistake.
      #
      # ⚠️ hardwareRequirements is an ELEMENT inside <item>, not an attribute on <enclosure>.
      # Sparkle reads it via SUAppcastElementHardwareRequirements =
      # "sparkle:hardwareRequirements" out of the item's element dictionary, and its own
      # fixture (Tests/Resources/testappcast_arm64HardwareRequirement.xml) writes it as an
      # element. Spelled as an attribute it parses fine, matches nothing, and silently offers
      # the arm64 build to every Intel client -- a package that cannot launch there.
      #
      # ⚠️ The Intel path CANNOT be verified on Apple Silicon, not even under Rosetta:
      # isArm64HardwareRequirementOK deliberately reports "hardware is compatible" when
      # sysctl.proc_translated says the process is translated (SPUAppcastItemStateResolver.m),
      # and Sparkle's own test comments "We're assuming this test is not run through Rosetta".
      # The guard below validates the feed's *shape*; the actual per-arch selection rests on
      # Sparkle's unit test plus, after release, the -intel.zip download counter moving off 0.
      - name: Extract tag changelog
        # ⚠️ 必须排在 appcast 生成**之前**:appcast 的 item 要把这段 annotation 当
        # release notes 内嵌进去(Sparkle 更新弹窗里显示的就是它)。原来这一步在
        # appcast 之后,于是弹窗里永远是空的 —— 用户升级前看不到这一版改了什么。
        # 之前的假设是错的:实测坐实 v1.0.0/v1.0.1 的 Release 页面从来没有显示过写进
        # annotated tag message 里的改动点清单——只有 GitHub 自动生成的 compare 链接。
        # generate_release_notes:true 在没有显式 body 时会直接把 body 整个替换成自动
        # 生成的内容,不是"追加在 tag message 后面"。这里显式把这个 tag 自己的
        # annotation 读出来,喂给下一步的 body 输入,GitHub 那边的规则是 body 在前、
        # generate_release_notes 的自动内容追加在后,两者都要才凑得齐。
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BODY="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate signed appcast
        if: startsWith(github.ref, 'refs/tags/')
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # 通过 env 传入,而不是在 run 脚本里直接写 ${{ steps.changelog.outputs.body }} --
          # 那种写法是 GitHub Actions 在脚本文本层面做字符串替换,tag annotation 原文
          # 里只要出现 " ` $( 这类 shell 语法字符就会破坏脚本甚至被当命令执行(这个
          # step 的环境里还带着 SPARKLE_PRIVATE_KEY)。env 传参这条路径里,shell 只会
          # 把它当一个变量值读,不会重新解析成语法。
          NOTES_RAW: ${{ steps.changelog.outputs.body }}
        run: |
          # lyrimuse/build.sh 一开头就 `cd "$(dirname "$0")"` 切到 lyrimuse/ 目录,
          # 所以 swift build 的 .build/ 产物实际生成在 lyrimuse/.build/ 下——不是
          # 这个 step 默认所在的仓库根目录。第一次真实 tag push(而不是手动 dispatch
          # 的 dry run,那条路径这一步整个被上面 if 门控跳过)才暴露这个路径写错的 bug。
          SIGN_UPDATE=$(find lyrimuse/.build/artifacts/sparkle -type f -name sign_update | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            echo "sign_update not found under lyrimuse/.build/artifacts/sparkle -- did the build step resolve the Sparkle SPM dependency?" >&2
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"
          # Both zips get signed -- one item per architecture (see the long note above).
          VERSION="${{ steps.version.outputs.bundle_version }}"
          ZIP_NAME="${{ steps.version.outputs.asset_base }}.zip"
          INTEL_ZIP_NAME="${{ steps.version.outputs.asset_base }}-intel.zip"
          # Fail loudly on a missing zip. Without this check `stat` just errors to stderr and
          # LENGTH ends up empty, which emits length="" -- a feed that parses but whose item
          # Sparkle refuses, i.e. "auto-update silently stopped working" for that arch.
          for z in "$ZIP_NAME" "$INTEL_ZIP_NAME"; do
            if [ ! -f "lyrimuse/dist/$z" ]; then
              echo "expected release zip missing: lyrimuse/dist/$z" >&2
              exit 1
            fi
          done
          LENGTH=$(stat -f%z "lyrimuse/dist/${ZIP_NAME}")
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "lyrimuse/dist/${ZIP_NAME}")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/${ZIP_NAME}"
          INTEL_LENGTH=$(stat -f%z "lyrimuse/dist/${INTEL_ZIP_NAME}")
          INTEL_SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "lyrimuse/dist/${INTEL_ZIP_NAME}")
          INTEL_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/${INTEL_ZIP_NAME}"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # tag annotation 原文 → 安全地放进 CDATA。只需处理 "]]>"(它会提前闭合 CDATA,
          # 拆成两段 CDATA 即可);其余字符在 CDATA 里都是字面量,不需要 HTML 转义。
          # ⚠️ 这里**不能**内嵌 flush-left 的 python/heredoc —— 那正是本 step 上面那段
          # 注释警告过的坑:`run: |` 块里任何一行的缩进都不能浅于块本身,顶格的脚本体会
          # 直接把这个 YAML 文件解析坏(2026-08-16 我第一版就这么写,被 YAML 校验逮住)。
          # 纯 shell 参数替换就够,不用外部解释器。
          escape_cdata() {
            local s="$1"
            s="${s//]]>/]]]]><![CDATA[>}"
            if [ -z "${s//[[:space:]]/}" ]; then
              s="See the GitHub release page for details."
            fi
            printf '%s' "$s"
          }
          # 双语拆分(2026-08-26 加):Sparkle 更新弹窗的外壳(标题/按钮)本来就跟着
          # 系统语言走(SUSparkleBundle() 自带一整套 .lproj),但正文一直是我们塞进去的
          # 一整段静态文本、不分语言,所有人看到的都是同一份中英夹杂。
          #
          # Sparkle 的 SUAppcast.m(bestNodeInNodes:name:)其实支持同一个 <item> 下
          # 按 xml:lang 放多份同名元素,用 NSBundle preferredLocalizationsFromArray:
          # 按系统语言偏好挑一份——这跟官方 generate_appcast 工具给
          # <sparkle:releaseNotesLink> 用的是同一套机制,<description> 走的是同一条
          # 解析路径(SURSSElementDescription 同样会先被"按 name 分组"再送进
          # bestNodeInNodes:)。
          #
          # 约定:tag annotation 里如果显式写了这两行标记,就按标记切成英文/中文两段,
          # 各自生成一个 <description xml:lang="...">;标题行(裸版本号那一行,在
          # 两个标记之前)语言中立,原样带进两份里。没有这两个标记的旧式 tag
          # (v1.4.0 及更早)原样退回单份 <description>,行为不变——这条分支必须保留,
          # 否则任何忘记按新格式写的 tag 都会在这一步直接崩掉整个发布。
          #   <!-- lang:en -->
          #   ……英文正文……
          #   <!-- lang:zh-Hans -->
          #   ……中文正文……
          EN_MARKER='<!-- lang:en -->'
          ZH_MARKER='<!-- lang:zh-Hans -->'
          if [[ "$NOTES_RAW" == *"$EN_MARKER"* && "$NOTES_RAW" == *"$ZH_MARKER"* ]]; then
            HEADER="${NOTES_RAW%%"$EN_MARKER"*}"
            AFTER_EN="${NOTES_RAW#*"$EN_MARKER"}"
            EN_BODY="${AFTER_EN%%"$ZH_MARKER"*}"
            ZH_BODY="${NOTES_RAW#*"$ZH_MARKER"}"
            EN_HTML=$(escape_cdata "${HEADER}${EN_BODY}")
            ZH_HTML=$(escape_cdata "${HEADER}${ZH_BODY}")
            DESCRIPTION_XML=$(
              echo '      <description xml:lang="en"><![CDATA[<pre>'
              printf '%s\n' "$EN_HTML"
              echo '      </pre>]]></description>'
              echo '      <description xml:lang="zh-Hans"><![CDATA[<pre>'
              printf '%s\n' "$ZH_HTML"
              echo '      </pre>]]></description>'
            )
          else
            NOTES_HTML=$(escape_cdata "$NOTES_RAW")
            DESCRIPTION_XML=$(
              echo '      <description><![CDATA[<pre>'
              printf '%s\n' "$NOTES_HTML"
              echo '      </pre>]]></description>'
            )
          fi
          # Not a heredoc -- a heredoc's body must stay flush-left to avoid picking up
          # this step's own YAML indentation as literal leading whitespace in every line
          # of the generated file, but flush-left content itself violates the YAML `run: |`
          # block scalar's rule that every line stay at or deeper than the block's own
          # indentation. Building the file line-by-line with `echo` sidesteps both: each
          # line's indentation in this workflow file is just normal shell-script
          # indentation, entirely independent of what actually lands inside the quotes.
          # 一个 item = 一种架构。$4 = "yes" 时才写 hardwareRequirements(见上面那段长注释:
          # 带这个元素的 item 在原生 x86_64 客户端那里会被 filterSupportedAppcast: 剔掉)。
          emit_item() {
            local url="$1" sig="$2" len="$3" arm64_only="$4"
            echo '    <item>'
            echo "      <title>${{ steps.version.outputs.version }}</title>"
            echo "      <pubDate>${PUB_DATE}</pubDate>"
            echo "      <sparkle:version>${VERSION}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            printf '%s\n' "$DESCRIPTION_XML"
            echo '      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            if [ "$arm64_only" = "yes" ]; then
              echo '      <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>'
            fi
            echo "      <enclosure url=\"${url}\" sparkle:version=\"${VERSION}\" sparkle:edSignature=\"${sig}\" length=\"${len}\" type=\"application/octet-stream\" />"
            echo '    </item>'
          }
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>Lyrimuse Updates</title>'
            echo "    <link>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</link>"
            echo '    <description>Lyrimuse release feed</description>'
            echo '    <language>en</language>'
            # ⚠️ arm64 必须**第一个** —— 两个 item 版本号相同,Sparkle 取先出现的那个。
            emit_item "$DOWNLOAD_URL" "$SIGNATURE" "$LENGTH" yes
            emit_item "$INTEL_DOWNLOAD_URL" "$INTEL_SIGNATURE" "$INTEL_LENGTH" no
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml
          echo "---- appcast.xml ----"
          cat appcast.xml
          # 形状自检。⚠️ 校验器**刻意放在独立文件**里而不是内嵌 heredoc:`run: |` 块里
          # 任何一行的缩进都不能浅于块本身,而 heredoc 的体又必须顶格(否则 python 收到
          # 的每行都带前导空白、直接 IndentationError)——这两条互相冲突,正是这个 step
          # 上面注释里记的那个 2026-08-16 的坑。独立文件同时还能本地直接跑。
          python3 .github/scripts/check_appcast.py appcast.xml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Lyrimuse ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          # Both variants ship: the unsuffixed one is arm64-only and is what Sparkle and
          # the Homebrew cask both point at; -intel is universal, for the Intel Macs that
          # every release up to v1.2.0 silently excluded. Each comes as a zip (the format
          # Sparkle unpacks and the cask installs, so it cannot be dropped) plus a dmg for
          # people downloading by hand.
          files: |
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}.zip
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}.zip.sha256
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}.dmg
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}-intel.zip
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}-intel.zip.sha256
            lyrimuse/dist/${{ steps.version.outputs.asset_base }}-intel.dmg
            appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
