name: Release

# Real tag push (v*) -> build, ad-hoc sign, package, publish a public GitHub Release.
# Manual dispatch (Actions tab, no tag needed) -> build, sign, package, upload as a
# workflow artifact only. The "Create GitHub Release" step is gated on the ref being a
# tag, not on which event triggered the run -- that's what makes workflow_dispatch a safe
# dry run: fire it against any branch, any time, and it will never create or touch a
# public Release. Only an actual tag push reaches that step.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Matches GOTOOLCHAIN=go1.24.4 hardcoded in both lyrimuse/build.sh and
  # lyrimuse-collector/build.sh -- system Go on some machines is older; go1.24.4 is the
  # first toolchain confirmed to emit a native LC_UUID + valid signature that AMFI accepts.
  GO_VERSION: "1.24.4"

jobs:
  build:
    name: Build, ad-hoc sign, package
    # Pinned to a specific image, not "macos-latest" -- macos-latest can silently jump to
    # a newer Xcode/OS on GitHub's own schedule; bump this deliberately instead.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 -- a shallow (default depth-1) checkout does NOT reliably bring
          # along annotated tag objects/messages, only the commit the pushed ref points to.
          # The "Extract tag changelog" step below reads the pushed tag's own annotation
          # message, which silently came back empty on v1.0.0/v1.0.1 for exactly this
          # reason (verified after the fact via `gh release view` -- both releases' pages
          # only ever showed GitHub's auto-generated compare link, never the changelog that
          # was actually written into each tag's message). Full history costs a bit more
          # fetch time on CI but this repo is small; correctness here matters more.
          fetch-depth: 0
        # lyrimuse/ and lyrimuse-collector/ are sibling directories in this one repo (not
        # two repos) -- lyrimuse/build.sh does `(cd ../lyrimuse-collector && ...)`, so a
        # single full checkout already lays both out side by side. No submodules needed.

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: lyrimuse-collector/go.sum
          # go.sum lives in lyrimuse-collector/, not the repo root -- without this,
          # setup-go's module cache silently never finds anything to key off of (seen as
          # a "Restore cache failed: ... Supported file pattern: go.mod" annotation on the
          # first real run of this workflow) and just re-downloads deps every time.
        # Installing the exact toolchain here means go1.24.4 is already on PATH and
        # cached before build.sh ever calls `go build`. When the active `go` binary
        # already reports 1.24.4, GOTOOLCHAIN=go1.24.4 (set inside build.sh itself) is
        # just a no-op version match -- no network fetch happens mid-build. Swift's
        # Command Line Tools ship preinstalled on GitHub's macOS runner images, so no
        # separate Swift setup step is needed.

      - name: Verify toolchains
        run: |
          swift --version
          go version

      - name: Install media-control (QQ 音乐支持)
        # ungive/media-control(BSD-3-Clause),build.sh 会把它拷进 .app 包——不装的话
        # build.sh 只是打个警告跳过这一步,不会让整个构建失败,但发布出去的这份 zip 就
        # 不支持切到 QQ 音乐。GitHub 的 macOS runner 镜像自带 Homebrew。
        run: brew install media-control

      - name: Determine version string
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            # BUNDLE_VERSION feeds build.sh's CFBundleShortVersionString/CFBundleVersion,
            # which the in-app update checker compares against this repo's Releases --
            # strip the leading "v" so it's a clean X.Y.Z, matching what UpdateChecker.swift
            # does to the tag_name it gets back from the GitHub API.
            BUNDLE_VERSION="${VERSION#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            # Not a real release tag, so there's no meaningful X.Y.Z here -- build.sh's own
            # placeholder default is fine, this build will never reach the public Releases
            # page anyway (see the "Create GitHub Release" step's tag-only gate below).
            BUNDLE_VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle_version=${BUNDLE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} (bundle version ${BUNDLE_VERSION})"

      - name: Build + assemble + ad-hoc sign
        run: LYRIMUSE_VERSION="${{ steps.version.outputs.bundle_version }}" ./lyrimuse/build.sh --no-restart
        # --no-restart is already exactly the CI-safe path -- it exits right after the
        # ad-hoc codesign/verify steps, before any of the launchctl kickstart/bootout/
        # bootstrap self-heal dance or the `open`/pgrep liveness check, none of which mean
        # anything on a headless runner with no logged-in Aqua session.

      - name: Sanity-check the signature
        run: |
          codesign -dvvv /Applications/Lyrimuse.app
          codesign -v /Applications/Lyrimuse.app && echo "app signature OK"
          codesign -v /Applications/Lyrimuse.app/Contents/Resources/collector && echo "collector signature OK"
          codesign -v /Applications/Lyrimuse.app/Contents/Resources/media-control/bin/media-control && echo "media-control signature OK"
          # Not a Gatekeeper/notarization check -- nothing here is notarized (see the
          # README's Gatekeeper-bypass section). This only confirms the ad-hoc signature
          # build.sh applied is internally well-formed before it ships.

      - name: Package as zip
        id: package
        run: |
          APP="/Applications/Lyrimuse.app"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="Lyrimuse-${VERSION}-macos.zip"
          # Defensive only -- nothing upstream in this job should have set quarantine,
          # but this mirrors the sanitize step other ad-hoc-signed macOS projects run
          # before zipping, so a stray xattr never rides along into the release asset.
          xattr -cr "$APP"
          # ditto, not `zip` -- preserves the code signature/resource fork correctly.
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "${ZIP}.sha256"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact (every run -- tag push or manual dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          retention-days: 14
        # Always runs, including on a bare workflow_dispatch with no tag -- the manual
        # dry-run path: download the zip straight from the Actions run page and smoke-test
        # it, without ever touching the public Releases tab.

      # Only runs on a real tag push, same gate as "Create GitHub Release" below --
      # appcast.xml's enclosure URL points at releases/latest/download/..., which is
      # meaningless without an actual Release, and this step needs the SPARKLE_PRIVATE_KEY
      # secret that a bare workflow_dispatch dry run has no reason to touch.
      #
      # sign_update lives in the same SPM binary-target download that build.sh's Sparkle
      # embedding step already pulled in (.build/artifacts/sparkle/Sparkle/bin/) -- no
      # separate download needed here.
      #
      # The private key never touches disk here: `--ed-key-file -` reads it from stdin,
      # piped straight from the GitHub Secret. This is Sparkle's own documented CI pattern
      # (see sign_update --help), not something improvised for this project.
      #
      # appcast.xml only ever lists this one release, not full history -- SPUStandardUpdaterController
      # only needs the latest item to decide "is there something newer than what's
      # installed," and not maintaining a multi-version feed avoids having to keep every
      # past release's zip around on the runner just to regenerate a fuller feed.
      - name: Generate signed appcast
        if: startsWith(github.ref, 'refs/tags/')
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # lyrimuse/build.sh 一开头就 `cd "$(dirname "$0")"` 切到 lyrimuse/ 目录,
          # 所以 swift build 的 .build/ 产物实际生成在 lyrimuse/.build/ 下——不是
          # 这个 step 默认所在的仓库根目录。第一次真实 tag push(而不是手动 dispatch
          # 的 dry run,那条路径这一步整个被上面 if 门控跳过)才暴露这个路径写错的 bug。
          SIGN_UPDATE=$(find lyrimuse/.build/artifacts/sparkle -type f -name sign_update | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            echo "sign_update not found under lyrimuse/.build/artifacts/sparkle -- did the build step resolve the Sparkle SPM dependency?" >&2
            exit 1
          fi
          chmod +x "$SIGN_UPDATE"
          ZIP="${{ steps.package.outputs.zip }}"
          VERSION="${{ steps.version.outputs.bundle_version }}"
          LENGTH=$(stat -f%z "$ZIP")
          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "$ZIP")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/${ZIP}"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # Not a heredoc -- a heredoc's body must stay flush-left to avoid picking up
          # this step's own YAML indentation as literal leading whitespace in every line
          # of the generated file, but flush-left content itself violates the YAML `run: |`
          # block scalar's rule that every line stay at or deeper than the block's own
          # indentation. Building the file line-by-line with `echo` sidesteps both: each
          # line's indentation in this workflow file is just normal shell-script
          # indentation, entirely independent of what actually lands inside the quotes.
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>Lyrimuse Updates</title>'
            echo "    <link>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</link>"
            echo '    <description>Lyrimuse release feed</description>'
            echo '    <language>en</language>'
            echo '    <item>'
            echo "      <title>${{ steps.version.outputs.version }}</title>"
            echo "      <pubDate>${PUB_DATE}</pubDate>"
            echo "      <sparkle:version>${VERSION}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            echo '      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            echo "      <enclosure url=\"${DOWNLOAD_URL}\" sparkle:version=\"${VERSION}\" sparkle:edSignature=\"${SIGNATURE}\" length=\"${LENGTH}\" type=\"application/octet-stream\" />"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml
          echo "---- appcast.xml ----"
          cat appcast.xml

      - name: Extract tag changelog
        # 之前的假设是错的:实测坐实 v1.0.0/v1.0.1 的 Release 页面从来没有显示过写进
        # annotated tag message 里的改动点清单——只有 GitHub 自动生成的 compare 链接。
        # generate_release_notes:true 在没有显式 body 时会直接把 body 整个替换成自动
        # 生成的内容,不是"追加在 tag message 后面"。这里显式把这个 tag 自己的
        # annotation 读出来,喂给下一步的 body 输入,GitHub 那边的规则是 body 在前、
        # generate_release_notes 的自动内容追加在后,两者都要才凑得齐。
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BODY="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Lyrimuse ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
            appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
