name = "nowplaying-state"
main = "src/index.js"
compatibility_date = "2025-07-18"
workers_dev = true

# 自定义域名(国内可达):zone yudaotor.me 已托管在本 CF 账号。
[[routes]]
pattern = "np.yudaotor.me"
custom_domain = true

[vars]
# 下面两个是本项目作者自己的部署值——自建时必须换成你自己的,否则 /history、以及
# /now·/cover 的 LB 兜底路径会展示作者本人的 ListenBrainz 数据,/share 卡片会跳转
# 到作者本人的展示页(见 README「从零搭建 state-worker」)。
LB_USER = "yudaotor"
WEB_PAGE_URL = "https://yudaotor.github.io/nowplaying/?user=yudaotor"

# PUSH_TOKEN 是 secret,用 `wrangler secret put PUSH_TOKEN` 设置,不写这里。

[[kv_namespaces]]
binding = "NP_STATE"
id = "89f5b07ec01b404498f92629354549dd"
